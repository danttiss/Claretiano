<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechVision - Fale Conosco</title>

    <link rel="stylesheet" href="css/style.css">
    
    <script src="javascript/funcoes.js" defer></script> 
</head>

<body>

    <header>
        <h1>TechVision</h1>

        <nav>
            <a href="index.html">Início</a>
            <a href="specs.html">Soluções</a>
            <a href="fotos.html">Projetos</a>
            <a href="multimidia.html">Multimídia</a>
            <a href="fale-conosco.html">Contato</a>
        </nav>
    </header>

    <main>

        <section>
            <h2>Fale Conosco</h2>

            <p>
                Preencha o formulário abaixo e entre em contato
                com a equipe da TechVision.
            </p>
        </section>

        <section class="formulario">

            <form id="formulario-contato">

                <div class="campo">
                    <label for="nome">Nome:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required>
                </div>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="(00) 00000-0000">
                </div>

                <div class="campo">
                    <label for="empresa">Empresa:</label>
                    <input
                        type="text"
                        id="empresa"
                        name="empresa"
                        placeholder="Nome da empresa">
                </div>

                <div class="campo">
                    <label for="assunto">Assunto:</label>

                    <select id="assunto" name="assunto" required>
                        <option value="">Selecione uma opção</option>
                        <option value="software">Desenvolvimento de Software</option>
                        <option value="ia">Inteligência Artificial</option>
                        <option value="consultoria">Consultoria</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="mensagem">Mensagem:</label>

                    <textarea
                        id="mensagem"
                        name="mensagem"
                        rows="6"
                        placeholder="Digite sua mensagem"
                        required></textarea>
                </div>

                <button type="submit">Enviar mensagem</button>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 TechVision - Soluções em Tecnologia</p>
    </footer>

<script src="javascript/funcoes.js"></script>

</body>

</html>
